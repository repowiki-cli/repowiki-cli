name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    if: "!contains(github.event.head_commit.message, 'dependabot')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --immutable
      - run: yarn build

      # Creates/updates the "Version Packages" PR when changesets are present.
      # Does nothing when hasChangesets == 'false' (version PR was just merged).
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs after the version PR is merged (no pending changesets).
      # Uses yarn npm publish so Yarn Berry resolves workspace:* in the
      # packed tarball — bypassing the changeset publish path that always
      # delegates to npm and never resolves workspace protocol.
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          yarn workspaces foreach --all --no-private npm publish --access public --tolerate-republish
          yarn changeset tag || true
          git push --tags
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
