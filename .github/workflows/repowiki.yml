name: Update RepoWiki

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"

permissions:
  contents: write

jobs:
  wiki:
    name: Update Wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install repowiki-cli
        run: npm install -g repowiki-cli
      - name: Update wiki
        run: repowiki wiki:update --provider=dashscope --model=qwen3-max || repowiki wiki:generate --provider=dashscope --model=qwen3-max
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      - name: Commit wiki changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update repowiki"
          file_pattern: ".repowiki/**"
