name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve repowiki-cli!
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Which layer does this affect?
      options:
        - wiki (Layer 1)
        - context (Layer 2)
        - spec (Layer 3)
        - core (interfaces/types)
        - cli (root)
        - other
    validations:
      required: true
